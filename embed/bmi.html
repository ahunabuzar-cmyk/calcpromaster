<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Iframe target only: this page is embeddable widget content, not a search landing page. -->
<meta name="robots" content="noindex, follow">
<title>BMI Calculator Widget</title>
<style>
  :root { --primary:#4f46e5; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#ffffff; --soft:#f1f5f9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); padding:16px; line-height:1.45; }
  .w-title { font-size:1.05rem; font-weight:700; margin-bottom:12px; }
  .row { margin-bottom:10px; }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:3px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; color:var(--ink); background:#fff; }
  input:focus, select:focus { outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .result { margin-top:14px; background:var(--soft); border-radius:10px; padding:14px; }
  .bmi { font-size:1.7rem; font-weight:800; color:var(--primary); }
  .bmi-label { font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .cat { margin-top:6px; font-size:.9rem; font-weight:600; }
  .range { margin-top:10px; font-size:.85rem; color:var(--muted); }
  .credit { margin-top:14px; font-size:.78rem; color:var(--muted); }
  .credit a { color:var(--primary); font-weight:600; text-decoration:none; }
  .credit a:hover, .credit a:focus { text-decoration:underline; }
  .note { margin-top:8px; font-size:.72rem; color:var(--muted); }
</style>
</head>
<body>
  <p class="w-title">BMI Calculator</p>
  <div class="row">
    <label for="b-units">Units</label>
    <select id="b-units">
      <option value="metric" selected>Metric (kg / cm)</option>
      <option value="imperial">Imperial (lb / ft+in)</option>
    </select>
  </div>
  <div class="grid">
    <div class="row">
      <label for="b-w" id="b-w-label">Weight (kg)</label>
      <input id="b-w" type="number" inputmode="decimal" min="0" step="0.1" value="70">
    </div>
    <div class="row">
      <label for="b-h" id="b-h-label">Height (cm)</label>
      <input id="b-h" type="number" inputmode="decimal" min="0" step="0.5" value="170">
    </div>
  </div>
  <div class="grid" id="b-imp-ft" hidden>
    <div class="row">
      <label for="b-ft">Height (feet)</label>
      <input id="b-ft" type="number" inputmode="numeric" min="0" max="8" step="1" value="5">
    </div>
    <div class="row">
      <label for="b-in">Height (inches)</label>
      <input id="b-in" type="number" inputmode="numeric" min="0" max="11" step="1" value="7">
    </div>
  </div>

  <div class="result" aria-live="polite">
    <p class="bmi-label">Your BMI</p>
    <p class="bmi" id="b-out">—</p>
    <p class="cat" id="b-cat"></p>
    <p class="range" id="b-range"></p>
  </div>

  <p class="note">BMI = weight ÷ height². Adult categories (WHO): &lt;18.5 underweight · 18.5–24.9 healthy · 25–29.9 overweight · 30+ obesity. BMI doesn't distinguish muscle from fat — it's a screening guide, not a diagnosis.</p>

  <p class="credit">Powered by <a href="https://calcpromaster.netlify.app/health/bmi" target="_blank" rel="noopener">CalcProMaster — free online calculators</a></p>

<script>
(function () {
  'use strict';
  var units = document.getElementById('b-units'),
      w = document.getElementById('b-w'),
      h = document.getElementById('b-h'),
      ft = document.getElementById('b-ft'),
      inch = document.getElementById('b-in'),
      impRow = document.getElementById('b-imp-ft'),
      wLabel = document.getElementById('b-w-label'),
      hLabel = document.getElementById('b-h-label'),
      out = document.getElementById('b-out'),
      cat = document.getElementById('b-cat'),
      range = document.getElementById('b-range');

  function category(v) {
    if (v < 18.5) return { t: 'Underweight', c: '#b45309' };
    if (v < 25) return { t: 'Healthy weight', c: '#15803d' };
    if (v < 30) return { t: 'Overweight', c: '#b45309' };
    return { t: 'Obesity', c: '#b91c1c' };
  }

  function calc() {
    var W = parseFloat(w.value), H = 0;
    if (units.value === 'metric') {
      H = parseFloat(h.value) / 100; // cm → m
    } else {
      var F = parseFloat(ft.value) || 0, I = parseFloat(inch.value) || 0;
      H = (F * 12 + I) * 0.0254; // ft+in → m
      W = W * 0.45359237; // lb → kg
    }
    if (!(W > 0) || !(H > 0)) { out.textContent = '—'; cat.textContent = ''; range.textContent = ''; return; }
    var bmi = W / (H * H);
    out.textContent = bmi.toFixed(1);
    var c = category(bmi);
    cat.textContent = c.t;
    cat.style.color = c.c;
    var lo = 18.5 * H * H, hi = 24.9 * H * H;
    range.textContent = units.value === 'metric'
      ? 'Healthy range for your height: ' + lo.toFixed(1) + '–' + hi.toFixed(1) + ' kg'
      : 'Healthy range for your height: ' + (lo / 0.45359237).toFixed(0) + '–' + (hi / 0.45359237).toFixed(0) + ' lb';
  }

  function toggle() {
    var imp = units.value === 'imperial';
    // imperial mode: single metric height field is replaced by the ft+in grid
    h.parentNode.hidden = imp;
    impRow.hidden = !imp;
    wLabel.textContent = imp ? 'Weight (lb)' : 'Weight (kg)';
  }

  units.addEventListener('change', function () { toggle(); calc(); });
  ['input', 'change'].forEach(function (ev) {
    [w, h, ft, inch].forEach(function (el) { el.addEventListener(ev, calc); });
  });
  toggle();
  calc();
})();
</script>
</body>
</html>
