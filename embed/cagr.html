<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Iframe target only: this page is embeddable widget content, not a search landing page. -->
<meta name="robots" content="noindex, follow">
<title>CAGR Calculator Widget</title>
<style>
  :root { --primary:#4f46e5; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#ffffff; --soft:#f1f5f9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); padding:16px; line-height:1.45; }
  .w-title { font-size:1.05rem; font-weight:700; margin-bottom:12px; }
  .row { margin-bottom:10px; }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:3px; }
  input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; color:var(--ink); background:#fff; }
  input:focus { outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .result { margin-top:14px; background:var(--soft); border-radius:10px; padding:14px; }
  .big { font-size:1.7rem; font-weight:800; color:var(--primary); }
  .big-label { font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .sub { display:flex; justify-content:space-between; gap:8px; margin-top:10px; font-size:.85rem; color:var(--ink); }
  .sub b { font-weight:700; }
  .credit { margin-top:14px; font-size:.78rem; color:var(--muted); }
  .credit a { color:var(--primary); font-weight:600; text-decoration:none; }
  .credit a:hover, .credit a:focus { text-decoration:underline; }
  .note { margin-top:8px; font-size:.72rem; color:var(--muted); }
</style>
</head>
<body>
  <p class="w-title">CAGR Calculator</p>
  <div class="grid">
    <div class="row">
      <label for="c-beg">Initial value</label>
      <input id="c-beg" type="number" inputmode="decimal" min="0" step="1000" value="100000">
    </div>
    <div class="row">
      <label for="c-cur">Currency</label>
      <select id="c-cur">
        <option value="USD" selected>USD $</option>
        <option value="INR">INR ₹</option>
        <option value="PKR">PKR ₨</option>
        <option value="AED">AED د.إ</option>
        <option value="EUR">EUR €</option>
        <option value="GBP">GBP £</option>
      </select>
    </div>
    <div class="row">
      <label for="c-end">Final value</label>
      <input id="c-end" type="number" inputmode="decimal" min="0" step="1000" value="200000">
    </div>
    <div class="row">
      <label for="c-yrs">Duration (years)</label>
      <input id="c-yrs" type="number" inputmode="decimal" min="0.25" max="80" step="0.25" value="5">
    </div>
  </div>

  <div class="result" aria-live="polite">
    <p class="big-label">Compound annual growth rate</p>
    <p class="big" id="c-cagr">—</p>
    <p class="sub"><span>Value grew by</span><b id="c-total">—</b></p>
    <p class="sub"><span>Total gain</span><b id="c-gain">—</b></p>
  </div>

  <p class="note">Formula: CAGR = (Final ÷ Initial)<sup>1/n</sup> − 1. Assumes steady compounding — real investments rarely grow in a straight line.</p>

  <p class="credit">Powered by <a href="https://calcpromaster.netlify.app/finance/cagr" target="_blank" rel="noopener">CalcProMaster — free online calculators</a></p>

<script>
(function () {
  'use strict';
  var beg = document.getElementById('c-beg'),
      end = document.getElementById('c-end'),
      yrs = document.getElementById('c-yrs'),
      cur = document.getElementById('c-cur'),
      outCagr = document.getElementById('c-cagr'),
      outTotal = document.getElementById('c-total'),
      outGain = document.getElementById('c-gain');

  function fmtMoney(n, code) {
    try {
      return new Intl.NumberFormat('en', { style: 'currency', currency: code, maximumFractionDigits: 0 }).format(n);
    } catch (e) {
      return code + ' ' + Math.round(n).toLocaleString('en');
    }
  }

  function calc() {
    var B = parseFloat(beg.value), F = parseFloat(end.value), Y = parseFloat(yrs.value), C = cur.value;
    if (!(B > 0) || !(F > 0) || !(Y > 0)) {
      outCagr.textContent = '—'; outTotal.textContent = '—'; outGain.textContent = '—';
      return;
    }
    var ratio = F / B;
    var cagr = Math.pow(ratio, 1 / Y) - 1;
    outCagr.textContent = (cagr * 100).toFixed(2) + '%';
    outTotal.textContent = '×' + ratio.toFixed(2) + ' over ' + Y + ' yr';
    outGain.textContent = fmtMoney(F - B, C);
  }

  ['input', 'change'].forEach(function (ev) {
    [beg, end, yrs, cur].forEach(function (el) { el.addEventListener(ev, calc); });
  });
  calc();
})();
</script>
</body>
</html>
