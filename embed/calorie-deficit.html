<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Iframe target only: this page is embeddable widget content, not a search landing page. -->
<meta name="robots" content="noindex, follow">
<title>Calorie Deficit Calculator Widget</title>
<style>
  :root { --primary:#4f46e5; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#ffffff; --soft:#f1f5f9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); padding:16px; line-height:1.45; }
  .w-title { font-size:1.05rem; font-weight:700; margin-bottom:12px; }
  .row { margin-bottom:10px; }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:3px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; color:var(--ink); background:#fff; }
  input:focus, select:focus { outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .result { margin-top:14px; background:var(--soft); border-radius:10px; padding:14px; }
  .big { font-size:1.7rem; font-weight:800; color:var(--primary); }
  .big-label { font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .sub { display:flex; justify-content:space-between; gap:8px; margin-top:10px; font-size:.85rem; color:var(--ink); }
  .sub b { font-weight:700; }
  .credit { margin-top:14px; font-size:.78rem; color:var(--muted); }
  .credit a { color:var(--primary); font-weight:600; text-decoration:none; }
  .credit a:hover, .credit a:focus { text-decoration:underline; }
  .note { margin-top:8px; font-size:.72rem; color:var(--muted); }
  .warn { color:#b45309; font-weight:600; }
</style>
</head>
<body>
  <p class="w-title">Calorie Deficit Calculator</p>
  <div class="grid">
    <div class="row">
      <label for="d-sex">Sex</label>
      <select id="d-sex">
        <option value="male" selected>Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="row">
      <label for="d-age">Age</label>
      <input id="d-age" type="number" inputmode="numeric" min="15" max="90" step="1" value="30">
    </div>
    <div class="row">
      <label for="d-w">Weight (kg)</label>
      <input id="d-w" type="number" inputmode="decimal" min="30" max="250" step="0.5" value="75">
    </div>
    <div class="row">
      <label for="d-h">Height (cm)</label>
      <input id="d-h" type="number" inputmode="decimal" min="120" max="220" step="1" value="175">
    </div>
    <div class="row">
      <label for="d-act">Activity level</label>
      <select id="d-act">
        <option value="1.2">Sedentary (desk job)</option>
        <option value="1.375" selected>Light (1–3 days/wk)</option>
        <option value="1.55">Moderate (3–5 days/wk)</option>
        <option value="1.725">Very active (6–7 days/wk)</option>
      </select>
    </div>
    <div class="row">
      <label for="d-def">Daily deficit (kcal)</label>
      <input id="d-def" type="number" inputmode="numeric" min="0" max="1000" step="50" value="500">
    </div>
  </div>

  <div class="result" aria-live="polite">
    <p class="big-label">Target daily intake</p>
    <p class="big" id="d-target">—</p>
    <p class="sub"><span>Maintenance (TDEE)</span><b id="d-tdee">—</b></p>
    <p class="sub"><span>Est. weekly loss</span><b id="d-week">—</b></p>
  </div>

  <p class="note">Mifflin–St Jeor BMR × activity = TDEE; target = TDEE − deficit. 7,700 kcal ≈ 1 kg of fat. <span class="warn">Don't go below 1,200 (F) / 1,500 (M) kcal without medical advice.</span></p>

  <p class="credit">Powered by <a href="https://calcpromaster.netlify.app/health/calorie-deficit" target="_blank" rel="noopener">CalcProMaster — free online calculators</a></p>

<script>
(function () {
  'use strict';
  var sex = document.getElementById('d-sex'),
      age = document.getElementById('d-age'),
      w = document.getElementById('d-w'),
      h = document.getElementById('d-h'),
      act = document.getElementById('d-act'),
      def = document.getElementById('d-def'),
      outTarget = document.getElementById('d-target'),
      outTdee = document.getElementById('d-tdee'),
      outWeek = document.getElementById('d-week');

  function calc() {
    var S = sex.value, A = parseFloat(age.value), W = parseFloat(w.value), H = parseFloat(h.value),
        M = parseFloat(act.value), D = parseFloat(def.value);
    if (!(A > 0) || !(W > 0) || !(H > 0) || !(M > 0) || isNaN(D) || D < 0) {
      outTarget.textContent = '—'; outTdee.textContent = '—'; outWeek.textContent = '—';
      return;
    }
    var bmr = 10 * W + 6.25 * H - 5 * A + (S === 'male' ? 5 : -161);
    var tdee = bmr * M;
    var target = Math.max(0, tdee - D);
    var kgPerWeek = (D * 7) / 7700;
    outTarget.textContent = Math.round(target).toLocaleString('en') + ' kcal';
    outTdee.textContent = Math.round(tdee).toLocaleString('en') + ' kcal';
    outWeek.textContent = kgPerWeek > 0 ? ('−' + kgPerWeek.toFixed(2) + ' kg/wk') : '—';
  }

  ['input', 'change'].forEach(function (ev) {
    [sex, age, w, h, act, def].forEach(function (el) { el.addEventListener(ev, calc); });
  });
  calc();
})();
</script>
</body>
</html>
