<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Iframe target only: this page is embeddable widget content, not a search landing page. -->
<meta name="robots" content="noindex, follow">
<title>Loan EMI Calculator Widget</title>
<style>
  :root { --primary:#4f46e5; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#ffffff; --soft:#f1f5f9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); padding:16px; line-height:1.45; }
  .w-title { font-size:1.05rem; font-weight:700; margin-bottom:12px; }
  .row { margin-bottom:10px; }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:3px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; color:var(--ink); background:#fff; }
  input:focus, select:focus { outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .result { margin-top:14px; background:var(--soft); border-radius:10px; padding:14px; }
  .emi { font-size:1.7rem; font-weight:800; color:var(--primary); }
  .emi-label { font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .sub { display:flex; justify-content:space-between; gap:8px; margin-top:10px; font-size:.85rem; color:var(--ink); }
  .sub b { font-weight:700; }
  .credit { margin-top:14px; font-size:.78rem; color:var(--muted); }
  .credit a { color:var(--primary); font-weight:600; text-decoration:none; }
  .credit a:hover, .credit a:focus { text-decoration:underline; }
  .note { margin-top:8px; font-size:.72rem; color:var(--muted); }
</style>
</head>
<body>
  <p class="w-title">Loan EMI Calculator</p>
  <div class="grid">
    <div class="row">
      <label for="w-amt">Loan amount</label>
      <input id="w-amt" type="number" inputmode="decimal" min="0" step="1000" value="500000">
    </div>
    <div class="row">
      <label for="w-cur">Currency</label>
      <select id="w-cur">
        <option value="PKR" selected>PKR ₨</option>
        <option value="INR">INR ₹</option>
        <option value="USD">USD $</option>
        <option value="EUR">EUR €</option>
        <option value="GBP">GBP £</option>
      </select>
    </div>
    <div class="row">
      <label for="w-rate">Interest rate (% per year)</label>
      <input id="w-rate" type="number" inputmode="decimal" min="0" max="100" step="0.05" value="14">
    </div>
    <div class="row">
      <label for="w-yrs">Tenure (years)</label>
      <input id="w-yrs" type="number" inputmode="decimal" min="0.5" max="40" step="0.5" value="5">
    </div>
  </div>

  <div class="result" aria-live="polite">
    <p class="emi-label">Monthly payment (EMI)</p>
    <p class="emi" id="w-emi">—</p>
    <p class="sub"><span>Total interest</span><b id="w-int">—</b></p>
    <p class="sub"><span>Total repaid</span><b id="w-tot">—</b></p>
  </div>

  <p class="note">Standard reducing-balance formula: EMI = P·r·(1+r)ⁿ ÷ ((1+r)ⁿ − 1). Actual lender charges (processing fees, insurance) are not included.</p>

  <p class="credit">Powered by <a href="https://calcpromaster.netlify.app/finance/loan-emi" target="_blank" rel="noopener">CalcProMaster — free online calculators</a></p>

<script>
(function () {
  'use strict';
  var amt = document.getElementById('w-amt'),
      rate = document.getElementById('w-rate'),
      yrs = document.getElementById('w-yrs'),
      cur = document.getElementById('w-cur'),
      out = document.getElementById('w-emi'),
      outInt = document.getElementById('w-int'),
      outTot = document.getElementById('w-tot');

  function fmt(n, code) {
    try {
      return new Intl.NumberFormat('en', { style: 'currency', currency: code, maximumFractionDigits: 0 }).format(n);
    } catch (e) { /* unknown code fallback */
      return code + ' ' + Math.round(n).toLocaleString('en');
    }
  }

  function calc() {
    var P = parseFloat(amt.value), R = parseFloat(rate.value), Y = parseFloat(yrs.value), C = cur.value;
    if (!(P > 0) || !(R >= 0) || !(Y > 0)) {
      out.textContent = '—'; outInt.textContent = '—'; outTot.textContent = '—';
      return;
    }
    var r = R / 12 / 100, n = Math.round(Y * 12), emi;
    if (r === 0) { emi = P / n; }
    else {
      var f = Math.pow(1 + r, n);
      emi = P * r * f / (f - 1);
    }
    var total = emi * n;
    out.textContent = fmt(emi, C);
    outInt.textContent = fmt(total - P, C);
    outTot.textContent = fmt(total, C);
  }

  ['input', 'change'].forEach(function (ev) {
    [amt, rate, yrs, cur].forEach(function (el) { el.addEventListener(ev, calc); });
  });
  calc();
})();
</script>
</body>
</html>
