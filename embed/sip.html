<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Iframe target only: this page is embeddable widget content, not a search landing page. -->
<meta name="robots" content="noindex, follow">
<title>SIP Calculator Widget</title>
<style>
  :root { --primary:#4f46e5; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#ffffff; --soft:#f1f5f9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); padding:16px; line-height:1.45; }
  .w-title { font-size:1.05rem; font-weight:700; margin-bottom:12px; }
  .row { margin-bottom:10px; }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:3px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; color:var(--ink); background:#fff; }
  input:focus, select:focus { outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .result { margin-top:14px; background:var(--soft); border-radius:10px; padding:14px; }
  .big { font-size:1.7rem; font-weight:800; color:var(--primary); }
  .big-label { font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .sub { display:flex; justify-content:space-between; gap:8px; margin-top:10px; font-size:.85rem; color:var(--ink); }
  .sub b { font-weight:700; }
  .credit { margin-top:14px; font-size:.78rem; color:var(--muted); }
  .credit a { color:var(--primary); font-weight:600; text-decoration:none; }
  .credit a:hover, .credit a:focus { text-decoration:underline; }
  .note { margin-top:8px; font-size:.72rem; color:var(--muted); }
</style>
</head>
<body>
  <p class="w-title">SIP Calculator</p>
  <div class="grid">
    <div class="row">
      <label for="s-amt">Monthly investment</label>
      <input id="s-amt" type="number" inputmode="decimal" min="0" step="500" value="5000">
    </div>
    <div class="row">
      <label for="s-cur">Currency</label>
      <select id="s-cur">
        <option value="INR" selected>INR ₹</option>
        <option value="PKR">PKR ₨</option>
        <option value="USD">USD $</option>
        <option value="AED">AED د.إ</option>
        <option value="EUR">EUR €</option>
        <option value="GBP">GBP £</option>
      </select>
    </div>
    <div class="row">
      <label for="s-rate">Expected return (% p.a.)</label>
      <input id="s-rate" type="number" inputmode="decimal" min="0" max="40" step="0.5" value="12">
    </div>
    <div class="row">
      <label for="s-yrs">Duration (years)</label>
      <input id="s-yrs" type="number" inputmode="decimal" min="1" max="40" step="1" value="10">
    </div>
  </div>

  <div class="result" aria-live="polite">
    <p class="big-label">Projected corpus</p>
    <p class="big" id="s-corpus">—</p>
    <p class="sub"><span>You invested</span><b id="s-inv">—</b></p>
    <p class="sub"><span>Wealth gained</span><b id="s-gain">—</b></p>
  </div>

  <p class="note">Formula: FV = P × ((1+i)ⁿ − 1) ÷ i × (1+i), with i = monthly rate, n = months. Monthly SIP at period start; returns assumed steady.</p>

  <p class="credit">Powered by <a href="https://calcpromaster.netlify.app/finance/sip" target="_blank" rel="noopener">CalcProMaster — free online calculators</a></p>

<script>
(function () {
  'use strict';
  var amt = document.getElementById('s-amt'),
      rate = document.getElementById('s-rate'),
      yrs = document.getElementById('s-yrs'),
      cur = document.getElementById('s-cur'),
      outCorpus = document.getElementById('s-corpus'),
      outInv = document.getElementById('s-inv'),
      outGain = document.getElementById('s-gain');

  function fmtMoney(n, code) {
    try {
      return new Intl.NumberFormat('en', { style: 'currency', currency: code, maximumFractionDigits: 0 }).format(n);
    } catch (e) {
      return code + ' ' + Math.round(n).toLocaleString('en');
    }
  }

  function calc() {
    var P = parseFloat(amt.value), R = parseFloat(rate.value), Y = parseFloat(yrs.value), C = cur.value;
    if (!(P > 0) || !(R >= 0) || !(Y > 0)) {
      outCorpus.textContent = '—'; outInv.textContent = '—'; outGain.textContent = '—';
      return;
    }
    var i = R / 12 / 100, n = Math.round(Y * 12), fv;
    if (i === 0) { fv = P * n; }
    else { fv = P * ((Math.pow(1 + i, n) - 1) / i) * (1 + i); }
    outCorpus.textContent = fmtMoney(fv, C);
    outInv.textContent = fmtMoney(P * n, C);
    outGain.textContent = fmtMoney(fv - P * n, C);
  }

  ['input', 'change'].forEach(function (ev) {
    [amt, rate, yrs, cur].forEach(function (el) { el.addEventListener(ev, calc); });
  });
  calc();
})();
</script>
</body>
</html>
