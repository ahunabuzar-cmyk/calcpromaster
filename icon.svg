<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:0.15"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Calculator screen -->
  <rect x="18" y="14" width="64" height="26" rx="6" fill="url(#screen)"/>
  <!-- Display text -->
  <text x="74" y="33" font-size="16" text-anchor="end" fill="white" font-family="'SF Mono','Consolas',monospace" font-weight="600" opacity="0.95">566+</text>
  <!-- Calculator buttons grid (4x3) -->
  <rect x="18" y="46" width="13" height="10" rx="3" fill="white" opacity="0.25"/>
  <rect x="35" y="46" width="13" height="10" rx="3" fill="white" opacity="0.25"/>
  <rect x="52" y="46" width="13" height="10" rx="3" fill="white" opacity="0.25"/>
  <rect x="69" y="46" width="13" height="10" rx="3" fill="#10b981" opacity="0.7"/>
  <rect x="18" y="60" width="13" height="10" rx="3" fill="white" opacity="0.2"/>
  <rect x="35" y="60" width="13" height="10" rx="3" fill="white" opacity="0.2"/>
  <rect x="52" y="60" width="13" height="10" rx="3" fill="white" opacity="0.2"/>
  <rect x="69" y="60" width="13" height="10" rx="3" fill="#f59e0b" opacity="0.6"/>
  <rect x="18" y="74" width="13" height="10" rx="3" fill="white" opacity="0.15"/>
  <rect x="35" y="74" width="13" height="10" rx="3" fill="white" opacity="0.15"/>
  <rect x="52" y="74" width="13" height="10" rx="3" fill="white" opacity="0.15"/>
  <rect x="69" y="74" width="30" height="10" rx="3" fill="#3b82f6" opacity="0.5"/>
  <!-- Brand letter overlay -->
  <text x="50" y="93" font-size="10" text-anchor="middle" fill="white" font-family="'Inter',sans-serif" font-weight="700" opacity="0.5">CalcPro</text>
</svg>