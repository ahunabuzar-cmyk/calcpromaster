[build]
  # Deploy the SAFE deploy/ folder (built by build-deploy.js), never the raw project root
  # (which contains .freebuff/, node_modules/, databases, tests, the Next.js codebase).
  publish = "deploy"
  command = "npm run lint:js && npm run audit && node build-deploy.js"

# SPA fallback + static pages + asset-404 rules all live in deploy/_redirects,
# which Netlify processes in file order (real files → static pages → renamed 301s →
# missing assets → 404 → extensionless routes → index.html 200). A catch-all here in
# netlify.toml would OVERRIDE those ordered rules (toml redirects take precedence over
# the _redirects file), turning every missing .js/.css/.png into a 200 soft-404.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://*.g.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.googleapis.com; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.g.doubleclick.net https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://open.er-api.com https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://*.g.doubleclick.net; worker-src 'self' blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com; frame-ancestors https:; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
