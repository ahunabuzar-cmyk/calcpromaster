[build]
  # Deploy the SAFE deploy/ folder (built by build-deploy.js), never the raw project root
  # (which contains .freebuff/, node_modules/, databases, tests, the Next.js codebase).
  publish = "deploy"
  command = "npm run lint:js && npm run audit && node build-deploy.js"

# SPA fallback + static pages + asset-404 rules all live in deploy/_redirects,
# which Netlify processes in file order (real files → static pages → renamed 301s →
# missing assets → 404 → extensionless routes → index.html 200). A catch-all here in
# netlify.toml would OVERRIDE those ordered rules (toml redirects take precedence over
# the _redirects file), turning every missing .js/.css/.png into a 200 soft-404.
#
# NOTE: all security/response headers (CSP, HSTS, cache rules) live ONLY in the
# _headers file. A [[headers]] block here would override _headers for the same
# paths (Netlify precedence), and the two copies previously drifted apart — the
# netlify.toml copy went stale and blocked Google Fonts (connect-src missing
# fonts.googleapis.com), breaking the accessibility audit. Single source: _headers.
